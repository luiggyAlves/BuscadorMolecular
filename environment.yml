  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - pip
  - pip:
    - transformers>=4.35.0,<4.40.0
    - einops>=0.6.0
    - chromadb>=0.4.0
    - streamlit>=1.28.0
