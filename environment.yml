  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - rdkit>=2023.3.1
  - numpy>=1.24.0
  - pandas>=2.0.0
  - pillow>=9.0.0
  - tqdm>=4.65.0
  # PyTorch com GPU (CUDA 12.1) — troque pytorch-cuda=12.1 por cpuonly para CPU
